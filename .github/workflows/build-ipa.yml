name: Build Muguet iOS IPA (Native GTA V Port)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build Native iOS IPA
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Restore Complete Upstream Vendor Files
        run: |
          git clone --depth 1 https://github.com/c22dev/muguet.git upstream_muguet
          cp -r upstream_muguet/vendor/* muguet-0.1/vendor/ || true
          rm -rf upstream_muguet

      - name: Clean and Patch Launcher.swift View
        run: |
          python3 -c '
          import os
          path = "muguet-0.1/ios/Launcher.swift"
          if os.path.exists(path):
              with open(path, "r") as f:
                  content = f.read()
              bad_block = """    @ViewBuilder var playButton: some View {
        let button = Button(action: start) {
            Text("Play").font(.title3.weight(.semibold)).frame(maxWidth: 220)
        }
        .controlSize(.large)
        if #available(iOS 26.0, *) {
            button.buttonStyle(.glassProminent)
        } else {
            button.buttonStyle(.borderedProminent)
        }
    }"""
              good_block = """    @ViewBuilder var playButton: some View {
        Button(action: start) {
            Text("Play").font(.title3.weight(.semibold)).frame(maxWidth: 220)
        }
        .controlSize(.large)
        .buttonStyle(.borderedProminent)
    }"""
              content = content.replace(bad_block, good_block)
              content = content.replace(".glassProminent", ".borderedProminent")
              with open(path, "w") as f:
                  f.write(content)
              print("Patched Launcher.swift successfully")
          '

      - name: Install Dependencies (xcodegen)
        run: |
          brew install xcodegen || true

      - name: Setup Rust & iOS Target
        run: |
          rustup toolchain install 1.98.1 || true
          rustup target add aarch64-apple-ios --toolchain 1.98.1 || true
          rustup target add aarch64-apple-ios || true
          sed -i '' 's/TOOLCHAIN=1.98.1/TOOLCHAIN=stable/g' muguet-0.1/make-ios.sh || true
          sed -i '' 's/"+\$TOOLCHAIN"//g' muguet-0.1/make-ios.sh || true

      - name: Run Build Script and Package IPA
        run: |
          cd muguet-0.1
          chmod +x make-ios.sh
          ./make-ios.sh --ipa

      - name: Locate and Collect .IPA File
        run: |
          mkdir -p output_ipa
          find . -name "*.ipa" -exec cp {} output_ipa/ ;
          ls -la output_ipa/

      - name: Upload Ready iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: Muguet-GTAV-iOS-IPA
          path: output_ipa/*.ipa
          retention-days: 14
