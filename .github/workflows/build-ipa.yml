name: Build Muguet iOS IPA (Native GTA V Port)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build Native iOS IPA
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies (xcodegen)
        run: |
          brew install xcodegen || true

      - name: Setup Rust & iOS Target
        run: |
          rustup update
          rustup target add aarch64-apple-ios

      - name: Run Build Script and Package IPA
        run: |
          cd muguet-0.1 || cd muguet* || cd .
          chmod +x make-ios.sh
          # Build in sideloadable unsigned .ipa mode
          ./make-ios.sh --ipa || bash make-ios.sh --ipa

      - name: Locate and Collect .IPA File
        run: |
          mkdir -p output_ipa
          find . -name "*.ipa" -exec cp {} output_ipa/ ;
          ls -la output_ipa/

      - name: Upload Ready iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: Muguet-GTAV-iOS-IPA
          path: output_ipa/*.ipa
          retention-days: 14
