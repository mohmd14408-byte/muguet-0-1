name: Build Muguet iOS IPA (Native GTA V Port)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build Native iOS IPA
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Restore Complete Upstream Vendor Files
        run: |
          git clone --depth 1 https://github.com/c22dev/muguet.git upstream_muguet
          cp -r upstream_muguet/vendor/* muguet-0.1/vendor/ || true
          rm -rf upstream_muguet

      - name: Fix Swift Syntax Error in Launcher.swift
        run: |
          # تصحيح خطأ glassProminent المتروك في سورس المطور
          find muguet-0.1 -name "Launcher.swift" -exec sed -i '' 's/\.glassProminent/\.borderedProminent/g' {} +
          find muguet-0.1 -name "Launcher.swift" -exec sed -i '' 's/iOS 26\.0/iOS 17\.0/g' {} +

      - name: Install Dependencies (xcodegen)
        run: |
          brew install xcodegen || true

      - name: Setup Rust & iOS Target
        run: |
          rustup toolchain install 1.98.1 || true
          rustup target add aarch64-apple-ios --toolchain 1.98.1 || true
          rustup target add aarch64-apple-ios || true
          sed -i '' 's/TOOLCHAIN=1.98.1/TOOLCHAIN=stable/g' muguet-0.1/make-ios.sh || true
          sed -i '' 's/"+\$TOOLCHAIN"//g' muguet-0.1/make-ios.sh || true

      - name: Run Build Script and Package IPA
        run: |
          cd muguet-0.1
          chmod +x make-ios.sh
          ./make-ios.sh --ipa

      - name: Locate and Collect .IPA File
        run: |
          mkdir -p output_ipa
          find . -name "*.ipa" -exec cp {} output_ipa/ \;
          ls -la output_ipa/

      - name: Upload Ready iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: Muguet-GTAV-iOS-IPA
          path: output_ipa/*.ipa
          retention-days: 14
