name: Build Native iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build iOS IPA Package
    runs-on: macos-14
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Assemble iOS Payload
        run: |
          mkdir -p Payload/GTAVNative.app
          cp -r * Payload/GTAVNative.app/ 2>/dev/null || true
          rm -rf Payload/GTAVNative.app/Payload

          if [ ! -f Payload/GTAVNative.app/Info.plist ]; then
            cat << 'EOF' > Payload/GTAVNative.app/Info.plist
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
    <key>CFBundleDisplayName</key>
    <string>GTA V Native</string>
    <key>CFBundleIdentifier</key>
    <string>com.rockstar.gtavnative</string>
    <key>CFBundleExecutable</key>
    <string>GTAVNative</string>
    <key>CFBundlePackageType</key>
    <string>APPL</string>
    <key>CFBundleShortVersionString</key>
    <string>1.0.0</string>
    <key>CFBundleVersion</key>
    <string>1</string>
    <key>LSRequiresIPhoneOS</key>
    <true/>
    <key>MinimumOSVersion</key>
    <string>15.0</string>
    <key>UIFileSharingEnabled</key>
    <true/>
    <key>LSSupportsOpeningDocumentsInPlace</key>
    <true/>
    <key>UIStatusBarHidden</key>
    <true/>
</dict>
</plist>
EOF
          fi

      - name: Compress into .IPA Archive
        run: |
          zip -r "GTAV-iOS-Release.ipa" Payload

      - name: Upload .IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GTAV-iOS-IPA
          path: "*.ipa"
