name: Build Muguet iOS IPA (Native GTA V Port)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build Native iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Restore Clean Upstream Files
        run: |
          echo "Restoring clean upstream repository files..."
          git clone --depth 1 https://github.com/c22dev/muguet.git upstream_muguet
          mkdir -p muguet-0.1/vendor
          cp -r upstream_muguet/vendor/* muguet-0.1/vendor/ || true
          cp upstream_muguet/ios/Launcher.swift muguet-0.1/ios/Launcher.swift
          cp upstream_muguet/make-ios.sh muguet-0.1/make-ios.sh
          cp upstream_muguet/build.rs muguet-0.1/build.rs
          rm -rf upstream_muguet

      - name: Fix Swift Syntax in Launcher.swift
        run: |
          python3 -c "
          import re, pathlib
          file_path = pathlib.Path('muguet-0.1/ios/Launcher.swift')
          content = file_path.read_text(encoding='utf-8')
          
          # Replace playButton with clean, valid SwiftUI
          clean_button = '''    @ViewBuilder var playButton: some View {\n        Button(action: start) {\n            Text(\"Play\").font(.title3.weight(.semibold)).frame(maxWidth: 220)\n        }\n        .controlSize(.large)\n        .buttonStyle(.borderedProminent)\n    }'''
          pattern = r'@ViewBuilder\s+var\s+playButton:\s+some\s+View\s*\{[\s\S]*?func\s+start\(\)'
          replacement = clean_button + '\n\n    func start()'
          content = re.sub(pattern, replacement, content)
          
          content = content.replace('.glassProminent', '.borderedProminent')
          content = content.replace('glassProminent', 'borderedProminent')
          file_path.write_text(content, encoding='utf-8')
          print('Successfully patched Launcher.swift')
          "
          echo "Checking Launcher.swift playButton:"
          sed -n '180,205p' muguet-0.1/ios/Launcher.swift

      - name: Patch Build Scripts for CI
        run: |
          python3 -c "
          import pathlib
          
          # 1. Patch make-ios.sh
          sh_path = pathlib.Path('muguet-0.1/make-ios.sh')
          sh_text = sh_path.read_text(encoding='utf-8')
          sh_text = sh_text.replace('export PATH=\"/opt/homebrew/opt/rustup/bin:\$PATH\"', 'export PATH=\"\$HOME/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:\$PATH\"')
          sh_text = sh_text.replace('cp -cRp', 'cp -Rp')
          sh_text = sh_text.replace('xcodebuild -quiet', 'xcodebuild')
          sh_text = sh_text.replace('cargo \"+\$TOOLCHAIN\"', 'cargo')
          sh_path.write_text(sh_text, encoding='utf-8')
          print('Patched make-ios.sh')
          
          # 2. Patch build.rs
          rs_path = pathlib.Path('muguet-0.1/build.rs')
          rs_text = rs_path.read_text(encoding='utf-8')
          old_run = 'let status = Command::new(&swiftc)'
          new_run = 'let output = Command::new(&swiftc)'
          if old_run in rs_text:
              rs_text = rs_text.replace('.status()', '.output()').replace(old_run, new_run)
              rs_text = rs_text.replace('assert!(status.success(), \"swiftc failed\");', 'if !output.status.success() { eprintln!(\"=== SWIFTC ERROR ===\\n{}\", String::from_utf8_lossy(&output.stderr)); panic!(\"swiftc failed\"); }')
              rs_path.write_text(rs_text, encoding='utf-8')
              print('Patched build.rs')
          "

      - name: Install Dependencies
        run: |
          brew install xcodegen || true

      - name: Setup Rust & iOS Target
        run: |
          rustup target add aarch64-apple-ios
          rustup default stable || true

      - name: Run Build Script and Package IPA
        run: |
          cd muguet-0.1
          chmod +x make-ios.sh
          ./make-ios.sh --ipa

      - name: Locate and Collect .IPA File
        run: |
          mkdir -p output_ipa
          find . -name '*.ipa' -exec cp -v {} output_ipa/ \;
          echo 'Collected files:'
          ls -la output_ipa/

      - name: Upload Ready iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: Muguet-GTAV-iOS-IPA
          path: output_ipa/*.ipa
          retention-days: 14
